<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JavaScipt Event KeyCode</title>
</head>
<body>
    <div id="container">
        <div id="starter">
            <h1>Please press a key...</h1>
        </div>
        <div id="result">
            <h1>101</h1>
        </div>
        <div id="boxes">
            <div class="box">
                <p class="head">event.key</p>
                <p class="box-result" id="event-key">Result</p>
            </div>
            <div class="box">
                <p class="head">event.location</p>
                <p class="box-result" id="event-location">Result</p>
            </div>
            <div class="box">
                <p class="head">event.which</p>
                <p class="box-result" id="event-which">Result</p>
            </div>
            <div class="box">
                <p class="head">event.code</p>
                <p class="box-result" id="event-code">Result</p>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
